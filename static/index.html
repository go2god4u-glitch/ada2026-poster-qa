<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ADA 2026 · Poster Q&A</title>
<style>
  :root{ --bg:#0b1020; --card:#141b30; --accent:#2f6df6; --me:#2f6df6; --them:#27314d; --text:#e9eefb; --muted:#9fb0d4; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; }
  header{ padding:16px 18px; background:linear-gradient(135deg,#1b2546,#0b1020);
    border-bottom:1px solid #ffffff14; }
  header h1{ margin:0; font-size:18px; letter-spacing:.2px; }
  header p{ margin:4px 0 0; font-size:12px; color:var(--muted); }

  /* intro form */
  .intro{ padding:22px 18px; overflow:auto; }
  .intro .desc{ font-size:14px; color:var(--muted); line-height:1.5; margin-bottom:18px; }
  label{ display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; }
  input,textarea{ width:100%; padding:13px 14px; border-radius:12px; border:1px solid #ffffff1f;
    background:#0e1530; color:var(--text); font-size:16px; outline:none; }
  input:focus,textarea:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; min-height:90px; }
  .opt{ color:#6f80a8; }
  .btn{ margin-top:20px; width:100%; padding:15px; border:0; border-radius:12px;
    background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .btn:disabled{ opacity:.5; }

  /* chat */
  .chat{ flex:1; display:none; flex-direction:column; min-height:0; }
  .msgs{ flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .bubble{ max-width:82%; padding:10px 13px; border-radius:16px; font-size:15px; line-height:1.45;
    white-space:pre-wrap; word-break:break-word; }
  .me{ align-self:flex-end; background:var(--me); border-bottom-right-radius:5px; }
  .them{ align-self:flex-start; background:var(--them); border-bottom-left-radius:5px; }
  .meta{ font-size:11px; color:var(--muted); align-self:center; margin:6px 0; }
  .composer{ display:flex; gap:8px; padding:12px; border-top:1px solid #ffffff14; background:#0e1530; }
  .composer textarea{ min-height:46px; max-height:120px; border-radius:22px; }
  .composer button{ flex:0 0 auto; width:46px; height:46px; border-radius:50%; border:0;
    background:var(--accent); color:#fff; font-size:20px; cursor:pointer; }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:#3ddc84; margin-right:5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ADA 2026 · Poster Q&amp;A</h1>
    <p id="subtitle"><span class="dot"></span>Ask the presenter directly — replies appear here live.</p>
  </header>

  <!-- 1) intro form -->
  <section class="intro" id="intro">
    <div class="desc">
      Have a question about the poster? Send it straight to the presenter and get a live reply.
      No app needed.
    </div>
    <label>Name *</label>
    <input id="f-name" autocomplete="name" placeholder="Your name">
    <label>Company / Institution *</label>
    <input id="f-company" autocomplete="organization" placeholder="Organization">
    <label>Email <span class="opt">(optional — for follow-up)</span></label>
    <input id="f-email" type="email" autocomplete="email" placeholder="you@example.com">
    <label>Your question *</label>
    <textarea id="f-question" placeholder="Type your question about the poster…"></textarea>
    <button class="btn" id="start">Send question →</button>
  </section>

  <!-- 2) chat -->
  <section class="chat" id="chat">
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Type a message…"></textarea>
      <button id="send" title="Send">➤</button>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const LS = "ada2026_session";
let session = null;      // {id, name}
let lastId = 0;          // last presenter message id seen
let polling = false;

function addBubble(text, who){
  const b = document.createElement("div");
  b.className = "bubble " + (who === "me" ? "me" : "them");
  b.textContent = text;
  $("#msgs").appendChild(b);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
}
function addMeta(text){
  const m = document.createElement("div");
  m.className = "meta"; m.textContent = text;
  $("#msgs").appendChild(m);
}

function showChat(){
  $("#intro").style.display = "none";
  $("#chat").style.display = "flex";
}

async function startSession(){
  const name = $("#f-name").value.trim();
  const company = $("#f-company").value.trim();
  const email = $("#f-email").value.trim();
  const q = $("#f-question").value.trim();
  if(!name || !company || !q){ alert("Please fill in name, company, and your question."); return; }
  $("#start").disabled = true;

  try{
    const r = await fetch("/api/session", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name, company, email})});
    const d = await r.json();
    if(!d.session_id){ throw new Error(d.error || "failed"); }
    session = {id:d.session_id, name};
    localStorage.setItem(LS, JSON.stringify(session));
    showChat();
    addMeta("Connected — the presenter has been notified.");
    await sendText(q);
    poll();
  }catch(e){
    alert("Sorry, couldn't connect. Please try again.");
    $("#start").disabled = false;
  }
}

async function sendText(text){
  text = text.trim();
  if(!text || !session) return;
  addBubble(text, "me");
  try{
    const r = await fetch("/api/message", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session_id: session.id, text})});
    if(!r.ok){ addMeta("⚠️ Message not delivered — please try again."); }
  }catch(e){ addMeta("⚠️ Message not sent — check your connection."); }
}

async function poll(){
  if(polling) return; polling = true;
  while(session){
    try{
      const r = await fetch(`/api/poll?session_id=${encodeURIComponent(session.id)}&after=${lastId}`);
      if(!r.ok){ await new Promise(res => setTimeout(res, 3000)); continue; }  // 4xx/5xx(콜드스타트 등) 백오프
      const d = await r.json();
      (d.messages || []).forEach(m => { addBubble(m.text, "them"); lastId = Math.max(lastId, m.id); });
    }catch(e){
      await new Promise(res => setTimeout(res, 3000));  // 네트워크 오류 백오프
    }
  }
}

// events
$("#start").addEventListener("click", startSession);
$("#send").addEventListener("click", () => { const v=$("#input").value; $("#input").value=""; sendText(v); });
$("#input").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#send").click(); }
});

// 새로고침해도 세션 유지
(function restore(){
  try{
    const s = JSON.parse(localStorage.getItem(LS) || "null");
    if(s && s.id){ session = s; showChat(); addMeta("Reconnected to your conversation."); poll(); }
  }catch(e){}
})();
</script>
</body>
</html>
