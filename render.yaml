# Render Blueprint - GitHub 연동 후 "New + > Blueprint" 로 한번에 배포
services:
  - type: web
    name: ada2026-qa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false          # 대시보드에서 직접 입력 (비밀)
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true  # 랜덤 시크릿 자동 생성
