name: keep-alive ping

# Render 무료 인스턴스가 슬립하지 않도록 /healthz 를 주기적으로 핑한다.
# 배포 후 repo variable PING_URL 에 배포 URL을 넣으면 동작 (예: https://ada2026-poster-qa.onrender.com).
# NOTE: GitHub Actions 크론은 부하 시 수~수십 분 지연될 수 있어 "베스트에포트 백업"이다.
#       콜드스타트가 절대 없어야 하면 UptimeRobot(5분 간격)을 1차 수단으로 쓸 것.

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (실제 실행은 더 늦을 수 있음)
  workflow_dispatch: {}      # 수동 실행도 허용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          URL="${{ vars.PING_URL }}"
          if [ -z "$URL" ]; then
            echo "PING_URL repo variable not set yet — skipping."
            exit 0
          fi
          echo "Pinging $URL/healthz"
          curl -fsS --max-time 60 "$URL/healthz" && echo " OK" || echo " (ping failed — may be cold-starting)"
